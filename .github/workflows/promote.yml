name: Promote release

# Publishes a draft that Release staged, once the candidate it holds has been accepted. The draft's own
# files are checked against the accepted JAR and published unchanged: nothing is rebuilt.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag of the draft, such as v1.12.0
        required: true
        type: string
      jar_sha256:
        description: SHA-256 of the accepted sequoia-VERSION.jar
        required: true
        type: string

permissions:
  contents: read

# Shares Release's group, so promoting waits for a staging run of the same tag.
concurrency:
  group: release-refs/tags/${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-24.04
    permissions:
      contents: write # publish the draft release
    env:
      TAG: ${{ inputs.tag }}
      JAR_SHA256: ${{ inputs.jar_sha256 }}
      GH_TOKEN: ${{ github.token }}
      # A task must not install the tools this job left out.
      MISE_TASK_RUN_AUTO_INSTALL: 'false'

    steps:
      - name: Check the inputs
        shell: bash
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-+][A-Za-z0-9.-]+)?$ ]] || { echo "Not a release tag: $TAG" >&2; exit 1; }
          [[ "$JAR_SHA256" =~ ^[0-9a-fA-F]{64}$ ]] || { echo "Not a SHA-256: $JAR_SHA256" >&2; exit 1; }

      - name: Checkout the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false

      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          version: 2026.10.23
          install_args: python gh
          # Publishing jobs install their tools fresh rather than from a cache.
          cache: false

      # The task checks the Modrinth token first, so a missing secret stops it before GitHub is
      # published. A rerun after a later failure re-checks what is already published.
      - name: Publish the accepted draft to GitHub and Modrinth
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: mise run release:promote "$TAG" "$JAR_SHA256"
