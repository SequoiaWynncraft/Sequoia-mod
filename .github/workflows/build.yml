name: Build

# One pipeline from source to JAR: the decoder guest is built once from authenticated sources,
# each native helper embeds exactly that guest, and the JAR packages the verified helpers.
# Release calls this workflow and publishes the JAR it built and tested.
# Steps run the same mise tasks as a local checkout (mise.toml); each job installs only its tools.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # A task must not install the tools its job left out.
  MISE_TASK_RUN_AUTO_INSTALL: 'false'
# Each job lists its tools in MISE_ENABLE_TOOLS rather than mise-action's install_args: naming
# java there would install both of mise.toml's JDKs regardless of their os filters.

jobs:
  guest:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MISE_ENABLE_TOOLS: python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Tool caches are per job; only trusted runs write them.
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          version: 2026.10.23
          cache_key_prefix: mise-guest
          cache_save: ${{ github.event_name != 'pull_request' }}
      - name: Test source verification, packaging and the release scripts
        run: mise run test:scripts
      # Caches are keyed by every input; PR runs cannot write main's entries, and tag builds
      # compile everything they ship. The guest's upstream archives are cached with it.
      - name: Restore a guest built from the same inputs
        id: cache
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            native/out/guest
            native/out/sources
          key: guest-${{ hashFiles('native/sources.json', 'native/guest.py', 'native/build-wasm.sh', 'native/wasm/decoder.c', 'native/keys/**') }}
      # Restored archives are checked like downloads; only missing or invalid ones are fetched.
      - name: Authenticate the upstream sources
        run: mise run native:guest --sources-only
      - name: Build the guest from authenticated sources
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          JOBS: '4'
        run: mise run native:guest
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: guest
          path: native/out/guest/
          if-no-files-found: error
          retention-days: 14
      # The pack job assembles the corresponding source from these same archives.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sources
          path: native/out/sources/
          if-no-files-found: error
          retention-days: 14

  # A helper whose inputs main already built is taken from the cache main saved after building and
  # verifying it on its own runner. The caches are restored here, on Linux, so a platform's runner,
  # scarce on macOS Arm above all, is needed only for a helper whose inputs changed. Tags take
  # nothing from a cache: every helper they ship is built and verified on its platform.
  native-cache:
    name: cached helpers
    needs: guest
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      build: ${{ steps.plan.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: guest
          path: native/out/guest
      # The cache key: the helper's inputs as committed, which read the same on every runner whatever
      # its line endings, and the guest it embeds. The platform jobs compute it the same way.
      - name: Digest the helpers' inputs
        id: inputs
        shell: bash
        run: |
          { git ls-tree -r HEAD -- native/decoder native/sandbox.cpp native/windows-probe.cpp native/build-native.py
            sha256sum native/out/guest/decoder.wasm | cut -d ' ' -f 1
          } | sha256sum | cut -d ' ' -f 1 | sed 's/^/digest=/' >> "$GITHUB_OUTPUT"
      - name: Restore the windows-x86_64 helper
        id: windows_x86_64
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            native/out/sandbox/windows-x86_64
            native/out/windows-x86_64
          key: native-v2-windows-x86_64-${{ steps.inputs.outputs.digest }}
          enableCrossOsArchive: true
      - name: Pass on the windows-x86_64 helper
        if: steps.windows_x86_64.outputs.cache-hit == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-windows-x86_64
          path: |
            native/out/sandbox/windows-x86_64/
            native/out/windows-x86_64/validation.json
          if-no-files-found: error
          retention-days: 14
      - name: Restore the windows-aarch64 helper
        id: windows_aarch64
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            native/out/sandbox/windows-aarch64
            native/out/windows-aarch64
          key: native-v2-windows-aarch64-${{ steps.inputs.outputs.digest }}
          enableCrossOsArchive: true
      - name: Pass on the windows-aarch64 helper
        if: steps.windows_aarch64.outputs.cache-hit == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-windows-aarch64
          path: |
            native/out/sandbox/windows-aarch64/
            native/out/windows-aarch64/validation.json
          if-no-files-found: error
          retention-days: 14
      - name: Restore the linux-x86_64 helper
        id: linux_x86_64
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            native/out/sandbox/linux-x86_64
            native/out/linux-x86_64
          key: native-v2-linux-x86_64-${{ steps.inputs.outputs.digest }}
          enableCrossOsArchive: true
      - name: Pass on the linux-x86_64 helper
        if: steps.linux_x86_64.outputs.cache-hit == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-linux-x86_64
          path: |
            native/out/sandbox/linux-x86_64/
            native/out/linux-x86_64/validation.json
          if-no-files-found: error
          retention-days: 14
      - name: Restore the linux-aarch64 helper
        id: linux_aarch64
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            native/out/sandbox/linux-aarch64
            native/out/linux-aarch64
          key: native-v2-linux-aarch64-${{ steps.inputs.outputs.digest }}
          enableCrossOsArchive: true
      - name: Pass on the linux-aarch64 helper
        if: steps.linux_aarch64.outputs.cache-hit == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-linux-aarch64
          path: |
            native/out/sandbox/linux-aarch64/
            native/out/linux-aarch64/validation.json
          if-no-files-found: error
          retention-days: 14
      - name: Restore the macos-x86_64 helper
        id: macos_x86_64
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            native/out/sandbox/macos-x86_64
            native/out/macos-x86_64
          key: native-v2-macos-x86_64-${{ steps.inputs.outputs.digest }}
          enableCrossOsArchive: true
      - name: Pass on the macos-x86_64 helper
        if: steps.macos_x86_64.outputs.cache-hit == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-macos-x86_64
          path: |
            native/out/sandbox/macos-x86_64/
            native/out/macos-x86_64/validation.json
          if-no-files-found: error
          retention-days: 14
      - name: Restore the macos-aarch64 helper
        id: macos_aarch64
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            native/out/sandbox/macos-aarch64
            native/out/macos-aarch64
          key: native-v2-macos-aarch64-${{ steps.inputs.outputs.digest }}
          enableCrossOsArchive: true
      - name: Pass on the macos-aarch64 helper
        if: steps.macos_aarch64.outputs.cache-hit == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-macos-aarch64
          path: |
            native/out/sandbox/macos-aarch64/
            native/out/macos-aarch64/validation.json
          if-no-files-found: error
          retention-days: 14
      - name: List the helpers to build on their platforms
        id: plan
        shell: bash
        env:
          HIT_WINDOWS_X86_64: ${{ steps.windows_x86_64.outputs.cache-hit }}
          HIT_WINDOWS_AARCH64: ${{ steps.windows_aarch64.outputs.cache-hit }}
          HIT_LINUX_X86_64: ${{ steps.linux_x86_64.outputs.cache-hit }}
          HIT_LINUX_AARCH64: ${{ steps.linux_aarch64.outputs.cache-hit }}
          HIT_MACOS_X86_64: ${{ steps.macos_x86_64.outputs.cache-hit }}
          HIT_MACOS_AARCH64: ${{ steps.macos_aarch64.outputs.cache-hit }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          runners = {"windows-x86_64": "windows-2025", "windows-aarch64": "windows-11-arm", "linux-x86_64": "ubuntu-24.04", "linux-aarch64": "ubuntu-24.04-arm", "macos-x86_64": "macos-15-intel", "macos-aarch64": "macos-15"}
          build = [{"platform": p, "runner": r} for p, r in runners.items()
                   if os.environ["HIT_" + p.replace("-", "_").upper()] != "true"]
          print("build=" + json.dumps(build, separators=(",", ":")))
          PY

  # Builds, tests and verifies each helper the cache did not have, on its own platform: all of them
  # for a tag.
  native:
    name: ${{ matrix.platform }}
    needs: [guest, native-cache]
    if: >-
      ${{ !cancelled() && needs.guest.result == 'success' && (startsWith(github.ref, 'refs/tags/')
      || (needs.native-cache.result == 'success' && needs.native-cache.outputs.build != '[]')) }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(startsWith(github.ref, 'refs/tags/') && '[{"platform":"windows-x86_64","runner":"windows-2025"}, {"platform":"windows-aarch64","runner":"windows-11-arm"}, {"platform":"linux-x86_64","runner":"ubuntu-24.04"}, {"platform":"linux-aarch64","runner":"ubuntu-24.04-arm"}, {"platform":"macos-x86_64","runner":"macos-15-intel"}, {"platform":"macos-aarch64","runner":"macos-15"}]' || needs.native-cache.outputs.build) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    env:
      PLATFORM: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: guest
          path: native/out/guest
      # The cache key: the helper's inputs as committed, which read the same on every runner whatever
      # its line endings, and the guest it embeds. native-cache computes it the same way.
      - name: Digest the helper's inputs
        id: inputs
        shell: bash
        run: |
          { git ls-tree -r HEAD -- native/decoder native/sandbox.cpp native/windows-probe.cpp native/build-native.py
            sha256sum native/out/guest/decoder.wasm | cut -d ' ' -f 1
          } | sha256sum | cut -d ' ' -f 1 | sed 's/^/digest=/' >> "$GITHUB_OUTPUT"
      # Saves the helper this job builds, for native-cache to restore on Linux; enableCrossOsArchive
      # makes a Windows runner's cache readable there. The key matches native-cache's.
      - name: Restore a helper built from the same inputs
        id: cache
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            native/out/sandbox/${{ matrix.platform }}
            native/out/${{ matrix.platform }}
          key: native-v2-${{ matrix.platform }}-${{ steps.inputs.outputs.digest }}
          enableCrossOsArchive: true
      - name: Install the musl linker
        if: runner.os == 'Linux' && steps.cache.outputs.cache-hit != 'true'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      # The Windows Arm runner's rustup may default to x64; build with the native Arm compiler.
      - name: Use the Arm Rust host on Windows Arm
        if: matrix.platform == 'windows-aarch64' && steps.cache.outputs.cache-hit != 'true'
        run: rustup set default-host aarch64-pc-windows-msvc
      # A restored helper skips compilation and the Rust unit tests, so it needs no Rust; the
      # probes always run.
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        env:
          MISE_ENABLE_TOOLS: ${{ steps.cache.outputs.cache-hit == 'true' && 'python' || 'python,rust' }}
        with:
          version: 2026.10.23
          cache_key_prefix: mise-native-${{ matrix.platform }}
          cache_save: ${{ github.event_name != 'pull_request' }}
      - name: Build, test and verify the helper
        shell: bash
        env:
          MISE_ENABLE_TOOLS: ${{ steps.cache.outputs.cache-hit == 'true' && 'python' || 'python,rust' }}
          RESTORED: ${{ steps.cache.outputs.cache-hit }}
        run: |
          if [[ "$RESTORED" == true ]]; then set -- --verify-only; fi
          mise run native:build "$PLATFORM" "$@"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-${{ matrix.platform }}
          path: |
            native/out/sandbox/${{ matrix.platform }}/
            native/out/${{ matrix.platform }}/validation.json
          if-no-files-found: error
          retention-days: 14

  # Packs the verified helpers once. The JAR and every Java test lane use these exact files.
  pack:
    needs: [guest, native-cache, native]
    # Runs whether the helpers came from the cache, from their platforms, or from both.
    if: >-
      ${{ !cancelled() && needs.guest.result == 'success'
      && !contains(fromJSON('["failure", "cancelled"]'), needs.native-cache.result)
      && !contains(fromJSON('["failure", "cancelled"]'), needs.native.result) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      MISE_ENABLE_TOOLS: python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: guest
          path: native/out/guest
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: native-*
          merge-multiple: true
          path: native/out
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sources
          path: native/out/sources
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          version: 2026.10.23
          cache_key_prefix: mise-pack
          cache_save: ${{ github.event_name != 'pull_request' }}
      # --sources-only authenticates the guest job's archives again and downloads nothing they cover.
      - name: Pack the verified helpers and assemble their corresponding source
        run: |
          mise run native:guest --sources-only
          mise run native:pack --require-all
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packs
          path: |
            native/out/sandbox/helpers-*.xz
            native/out/sandbox/provenance.json
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: corresponding-source
          path: native/out/dist/
          if-no-files-found: error
          retention-days: 14

  build:
    needs: pack
    # A skipped helper job upstream, as when every helper came from the cache, must not skip this.
    if: ${{ !cancelled() && needs.pack.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MISE_ENABLE_TOOLS: java,python,rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          version: 2026.10.23
          cache_key_prefix: mise-build
          cache_save: ${{ github.event_name != 'pull_request' }}
      # Pull requests restore Gradle's dependency cache; only trusted runs save it.
      - name: Restore the Gradle cache
        id: gradle-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle.properties') }}
          # A change to the build files, a version bump included, starts from the newest earlier cache
          # and downloads only what changed, instead of all of it from Maven Central, which rate-limits
          # CI runners.
          restore-keys: gradle-${{ runner.os }}-${{ runner.arch }}-
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packs
          path: native/out/sandbox
      - name: Check the bundled notices against Cargo.lock and the toolchain
        run: mise run native:notices
      - name: Build
        run: mise run build --stacktrace
      - name: Check the JAR carries exactly the tested packs
        run: mise run native:verify-jar
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jar
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
      - name: Save the Gradle cache
        if: github.event_name != 'pull_request' && steps.gradle-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ steps.gradle-cache.outputs.cache-primary-key }}

  # The updater and image previews on real systems: Windows file locking and helper processes,
  # macOS Seatbelt and code signing, and unpacking the helpers on each CPU. Pull requests run the two
  # most used systems; tags and manual runs cover all six platforms.
  java-native-tests:
    name: java ${{ matrix.platform }}
    needs: pack
    # A skipped helper job upstream, as when every helper came from the cache, must not skip this.
    if: ${{ !cancelled() && needs.pack.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON((startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch') && '[{"platform":"windows-x86_64","runner":"windows-2025"},{"platform":"macos-aarch64","runner":"macos-15"},{"platform":"windows-aarch64","runner":"windows-11-arm"},{"platform":"linux-aarch64","runner":"ubuntu-24.04-arm"},{"platform":"macos-x86_64","runner":"macos-15-intel"}]' || '[{"platform":"windows-x86_64","runner":"windows-2025"},{"platform":"macos-aarch64","runner":"macos-15"}]') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      MISE_ENABLE_TOOLS: java
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          version: 2026.10.23
          cache_key_prefix: mise-java-${{ matrix.platform }}
          cache_save: ${{ github.event_name != 'pull_request' }}
      - name: Restore the Gradle cache
        id: gradle-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle.properties') }}
          # A change to the build files, a version bump included, starts from the newest earlier cache
          # and downloads only what changed, instead of all of it from Maven Central, which rate-limits
          # CI runners.
          restore-keys: gradle-${{ runner.os }}-${{ runner.arch }}-
      # The packs this run's JAR ships; the build job checks the JAR holds these exact files.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packs
          path: native/out/sandbox
      - name: Run updater and image preview tests
        run: mise run test:platform --stacktrace
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: java-test-reports-${{ matrix.platform }}
          path: |
            build/reports/tests/test
            build/test-results/test
      - name: Save the Gradle cache
        if: github.event_name != 'pull_request' && steps.gradle-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ steps.gradle-cache.outputs.cache-primary-key }}
