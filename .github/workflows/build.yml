name: Build

# One pipeline from source to JAR: the decoder guest is built once from authenticated sources,
# each native helper embeds exactly that guest, and the JAR packages the verified helpers.
# Release calls this workflow and publishes the JAR it built and tested.
# Steps run the same mise tasks as a local checkout (mise.toml); each job installs only its tools.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # A task must not install the tools its job left out.
  MISE_TASK_RUN_AUTO_INSTALL: 'false'
# Each job lists its tools in MISE_ENABLE_TOOLS rather than mise-action's install_args: naming
# java there would install both of mise.toml's JDKs regardless of their os filters.

jobs:
  guest:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MISE_ENABLE_TOOLS: python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Tool caches are per job; only trusted runs write them.
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          version: 2026.10.23
          cache_key_prefix: mise-guest
          cache_save: ${{ github.event_name != 'pull_request' }}
      - name: Test source verification, packaging and the release scripts
        run: mise run test:scripts
      # Caches are keyed by every input; PR runs cannot write main's entries, and tag builds
      # compile everything they ship.
      - name: Restore a guest built from the same inputs
        id: cache
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: native/out/guest
          key: guest-${{ hashFiles('native/sources.json', 'native/guest.py', 'native/build-wasm.sh', 'native/wasm/decoder.c', 'native/keys/**') }}
      - name: Build the guest from authenticated sources
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          JOBS: '4'
        run: mise run native:guest
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: guest
          path: native/out/guest/
          if-no-files-found: error
          retention-days: 14

  native:
    name: ${{ matrix.platform }}
    needs: guest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {platform: windows-x86_64, runner: windows-2025}
          - {platform: windows-aarch64, runner: windows-11-arm}
          - {platform: linux-x86_64, runner: ubuntu-24.04}
          - {platform: linux-aarch64, runner: ubuntu-24.04-arm}
          - {platform: macos-x86_64, runner: macos-15-intel}
          - {platform: macos-aarch64, runner: macos-15}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    env:
      PLATFORM: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: guest
          path: native/out/guest
      - name: Restore a helper built from the same inputs
        id: cache
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            native/out/sandbox/${{ matrix.platform }}
            native/out/${{ matrix.platform }}
          key: native-${{ matrix.platform }}-${{ hashFiles('native/out/guest/decoder.wasm', 'native/decoder/**', 'native/sandbox.cpp', 'native/windows-probe.cpp', 'native/build-native.py') }}
      - name: Install the musl linker
        if: runner.os == 'Linux' && steps.cache.outputs.cache-hit != 'true'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      # The Windows Arm runner's rustup may default to x64; build with the native Arm compiler.
      - name: Use the Arm Rust host on Windows Arm
        if: matrix.platform == 'windows-aarch64' && steps.cache.outputs.cache-hit != 'true'
        run: rustup set default-host aarch64-pc-windows-msvc
      # A restored helper skips compilation and the Rust unit tests, so it needs no Rust; the
      # probes always run.
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        env:
          MISE_ENABLE_TOOLS: ${{ steps.cache.outputs.cache-hit == 'true' && 'python' || 'python,rust' }}
        with:
          version: 2026.10.23
          cache_key_prefix: mise-native-${{ matrix.platform }}
          cache_save: ${{ github.event_name != 'pull_request' }}
      - name: Build, test and verify the helper
        shell: bash
        env:
          MISE_ENABLE_TOOLS: ${{ steps.cache.outputs.cache-hit == 'true' && 'python' || 'python,rust' }}
          RESTORED: ${{ steps.cache.outputs.cache-hit }}
        run: |
          if [[ "$RESTORED" == true ]]; then set -- --verify-only; fi
          mise run native:build "$PLATFORM" "$@"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-${{ matrix.platform }}
          path: |
            native/out/sandbox/${{ matrix.platform }}/
            native/out/${{ matrix.platform }}/validation.json
          if-no-files-found: error
          retention-days: 14

  # Packs the verified helpers once. The JAR and every Java test lane use these exact files.
  pack:
    needs: native
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      MISE_ENABLE_TOOLS: python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: guest
          path: native/out/guest
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: native-*
          merge-multiple: true
          path: native/out
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          version: 2026.10.23
          cache_key_prefix: mise-pack
          cache_save: ${{ github.event_name != 'pull_request' }}
      - name: Pack the verified helpers and assemble their corresponding source
        run: |
          mise run native:guest --sources-only
          mise run native:pack --require-all
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packs
          path: |
            native/out/sandbox/helpers-*.xz
            native/out/sandbox/provenance.json
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: corresponding-source
          path: native/out/dist/
          if-no-files-found: error
          retention-days: 14

  build:
    needs: pack
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MISE_ENABLE_TOOLS: java,python,rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          version: 2026.10.23
          cache_key_prefix: mise-build
          cache_save: ${{ github.event_name != 'pull_request' }}
      # Pull requests restore Gradle's dependency cache; only trusted runs save it.
      - name: Restore the Gradle cache
        id: gradle-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle.properties') }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packs
          path: native/out/sandbox
      - name: Check the bundled notices against Cargo.lock and the toolchain
        run: mise run native:notices
      - name: Build
        run: mise run build --stacktrace
      - name: Check the JAR carries exactly the tested packs
        run: mise run native:verify-jar
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jar
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
      - name: Save the Gradle cache
        if: github.event_name != 'pull_request' && steps.gradle-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ steps.gradle-cache.outputs.cache-primary-key }}

  # The updater and image previews on real systems: Windows file locking and helper processes,
  # macOS Seatbelt and code signing, and unpacking the helpers on each CPU. Pull requests run the two
  # most used systems; tags and manual runs cover all six platforms.
  java-native-tests:
    name: java ${{ matrix.platform }}
    needs: pack
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON((startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch') && '[{"platform":"windows-x86_64","runner":"windows-2025"},{"platform":"macos-aarch64","runner":"macos-15"},{"platform":"windows-aarch64","runner":"windows-11-arm"},{"platform":"linux-aarch64","runner":"ubuntu-24.04-arm"},{"platform":"macos-x86_64","runner":"macos-15-intel"}]' || '[{"platform":"windows-x86_64","runner":"windows-2025"},{"platform":"macos-aarch64","runner":"macos-15"}]') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      MISE_ENABLE_TOOLS: java
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          version: 2026.10.23
          cache_key_prefix: mise-java-${{ matrix.platform }}
          cache_save: ${{ github.event_name != 'pull_request' }}
      - name: Restore the Gradle cache
        id: gradle-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle.properties') }}
      # The packs this run's JAR ships; the build job checks the JAR holds these exact files.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packs
          path: native/out/sandbox
      - name: Run updater and image preview tests
        run: mise run test:platform --stacktrace
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: java-test-reports-${{ matrix.platform }}
          path: |
            build/reports/tests/test
            build/test-results/test
      - name: Save the Gradle cache
        if: github.event_name != 'pull_request' && steps.gradle-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ steps.gradle-cache.outputs.cache-primary-key }}
