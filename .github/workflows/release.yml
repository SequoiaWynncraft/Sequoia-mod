name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

# One release per tag at a time; a second run waits instead of publishing over the first.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # A task must not install the tools its job left out.
  MISE_TASK_RUN_AUTO_INSTALL: 'false'

jobs:
  preflight:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          version: 2026.10.23
          install_args: python
          # Publishing jobs install their tools fresh rather than from a cache.
          cache: false
      - name: Validate release tag, notes and source version
        run: mise run release:check

  build:
    needs: preflight
    uses: ./.github/workflows/build.yml # zizmor: ignore[self-repository] the tagged commit's own Build workflow

  # Stages exactly the JAR and native source archive the build job built and tested as a draft
  # release, which nobody sees as "latest". After acceptance, promote.yml publishes these same files.
  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write # create the draft release and upload its assets

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: jar
          path: build/libs

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: corresponding-source
          path: build/corresponding-source

      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          version: 2026.10.23
          install_args: python gh
          # Publishing jobs install their tools fresh rather than from a cache.
          cache: false

      - name: Check the built JAR against the release tag
        id: release_metadata
        run: mise run release:check --jar-directory build/libs

      - name: Stage the draft release and check it holds exactly these files
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES: ${{ steps.release_metadata.outputs.changelog }}
          TAG: ${{ github.ref_name }}
        run: mise run release:stage "$TAG"
