name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

# One release per tag at a time; a second run waits instead of publishing over the first.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate release tag, notes and source version
        run: python3 scripts/release_metadata.py

  build:
    needs: preflight
    uses: ./.github/workflows/build.yml

  # Stages exactly the JAR and native source archive the build job built and tested as a draft
  # release, which nobody sees as "latest". After acceptance, promote.yml publishes these same files.
  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write # create the draft release and upload its assets

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: jar
          path: build/libs

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: corresponding-source
          path: build/corresponding-source

      - name: Resolve release metadata
        id: release_metadata
        shell: bash
        run: |
          python3 scripts/release_metadata.py --jar-directory build/libs

      - name: Generate SHA-256 files
        shell: bash
        run: |
          set -euo pipefail
          # Record only the file name, so a downloaded asset checks with sha256sum -c.
          for file in build/libs/*.jar build/corresponding-source/*; do
            (cd "$(dirname "$file")" && sha256sum "$(basename "$file")") > "$file.sha256"
          done

      - name: Stage the draft release and check it holds exactly these files
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES: ${{ steps.release_metadata.outputs.changelog }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          files=(build/libs/*.jar build/libs/*.jar.sha256 build/corresponding-source/*)
          python3 scripts/github_release.py stage "$TAG" "${files[@]}"
          python3 scripts/github_release.py verify "$TAG" "${files[@]}"
          {
            echo "### Release candidate $TAG (draft)"
            echo
            echo "Accept the draft's own files, then run Promote release with the JAR's SHA-256:"
            echo
            echo '```'
            sha256sum build/libs/*.jar
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
