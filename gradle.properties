# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G
# Maven Central answers bursts from CI runners with 429 Too Many Requests, which Gradle retries, by
# default three times from 125 ms apart. Back off for longer: 2 s, then doubling, five attempts in all.
systemProp.org.gradle.internal.network.retry.max.attempts=5
systemProp.org.gradle.internal.network.retry.initial.backOff=2000
# Fabric Properties
# check these on https://modmuss50.me/fabric.html
minecraft_version=1.21.11
loader_version=0.18.4
# Mod Properties
mod_version=1.12.0
maven_group=com.seqwawa
archives_base_name=sequoia
# Dependencies
# check this on https://modmuss50.me/fabric.html
fabric_version=0.141.2+1.21.11
pounce_version=d921e2c156
wynntils_version=4.2.9
nanovg_version=3.3.3
# Backend environment: production or staging
backend_environment=production
# Release JAR size budget in bytes (see checkReleaseJarSize in build.gradle)
max_release_jar_bytes=20000000
